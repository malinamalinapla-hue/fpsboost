name: build
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Распаковать zip
        run: unzip -q fpsboost-src.zip -d project
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.12
      - name: Собрать мод
        run: gradle build
        working-directory: project/fpsboost
      - uses: actions/upload-artifact@v4
        with:
          name: fpsboost-mod
          path: project/fpsboost/build/libs/*.jar
